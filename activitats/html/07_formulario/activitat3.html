<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Registro de Usuario</h2>

<form action="#" method="post">

    <label>Nombre:</label><br>
    <input type="text" name="nombre" required>

    <br><br>

    <label>Apellido:</label><br>
    <input type="text" name="apellido" required>

    <br><br>

    <label>Nombre de usuario:</label><br>
    <input type="text" name="usuario" required>

    <br><br>

    <label>Correo electrónico:</label><br>
    <input type="email" name="email" required>

    <br><br>

    <label>Contraseña:</label><br>
    <input type="password" name="password" required>

    <br><br>

    <label>Fecha de nacimiento:</label><br>
    <input type="date" name="fecha_nacimiento">

    <br><br>

    <label>Género:</label><br>
    <input type="radio" name="genero" value="masculino"> Masculino<br>
    <input type="radio" name="genero" value="femenino"> Femenino<br>
    <input type="radio" name="genero" value="otro"> Otro

    <br><br>

    <label>
        <input type="checkbox" name="terminos" required>
        Acepto los términos y condiciones
    </label>

    <br><br>

    <input type="submit" value="Registrarse">

</form>


<table border="0">
  <tr>
    <td>
        <form>
              <fieldset>
            <legend><h2>Registro de Usuario</h2></legend>           
                 
             <label>Nombre</label><br>
             <input type="text" size="30"><br><br>   
             
             
             <label>Apellido</label><br>
             <input type="text" size="30"><br><br> 

             <label>Nombre de usuario</label><br>
             <input type="text" size="30"><br><br> 

             <label>Correo electronico</label><br>
             <input type="email" size="30" placeholder="correo@ejemplo.com"><br>           
                <br>

             <label>Contraseña:</label><br>
            <input type="password" size="20"name="password" required>

             <br><br>

             <label>Fecha de nacimiento:</label><br>
            <input type="date" name="fecha_nacimiento">

             <br><br>

            <label>Género:</label><br>
            <input type="radio" name="genero" value="masculino"> Masculino<br>
             <input type="radio" name="genero" value="femenino"> Femenino<br>
            <input type="radio" name="genero" value="otro"> Otro

            <br><br>

            <label>
            <input type="checkbox" name="terminos" required>
             Acepto los términos y condiciones
            </label>

            <br><br>

            <input type="submit" value="Registrarse">


             <label>Mensaje:</label><br>
             <textarea cols="32" rows="5"></textarea><br>

             <input type="submit" value="Enviar">
            </fieldset>





        </form>
    </td>
  </tr>
</table>
</body>
</html>
