<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Búsqueda de Cámaras de Fotos</h2>

<form action="#" method="get">

    <label>Marca:</label><br>
    <select name="marca">
        <option value="">Cualquiera</option>
        <option value="canon">Canon</option>
        <option value="nikon">Nikon</option>
        <option value="sony">Sony</option>
        <option value="fujifilm">Fujifilm</option>
    </select>

    <br><br>

    <label>Tipo de cámara:</label><br>
    <input type="radio" name="tipo" value="reflex"> Réflex<br>
    <input type="radio" name="tipo" value="mirrorless"> Mirrorless<br>
    <input type="radio" name="tipo" value="compacta"> Compacta

    <br><br>

    <label>Resolución mínima (MP):</label><br>
    <input type="number" name="megapixeles" min="5">

    <br><br>

    <label>Precio máximo:</label><br>
    <input type="number" name="precio_max">

    <br><br>

    <label>¿Con grabación de vídeo?</label><br>
    <input type="checkbox" name="video" value="si"> Sí

    <br><br>

    <input type="submit" value="Buscar">





<table border="0">
  <tr>
    <td>
        <form>
            <fieldset>
             <legend><h2>Registro de Usuario</h2></legend>           
                 
             <label>Nombre</label><br>
             <input type="text" size="30"><br><br>                
             
             <label>Apellido</label><br>
             <input type="text" size="30"><br><br> 

             <label>Nombre de usuario</label><br>
             <input type="text" size="30"><br><br> 

             <label>Correo electronico</label><br>
             <input type="email" size="30" placeholder="correo@ejemplo.com"><br>           
                <br>

             <label>Contraseña:</label><br>
             <input type="password" size="20"name="password" required>

             <br><br>

             <label>Fecha de nacimiento:</label><br>
             <input type="date" name="fecha_nacimiento">

             <br><br>

             <label>Género:</label><br>
             <input type="radio" name="genero" value="masculino"> Masculino<br>
             <input type="radio" name="genero" value="femenino"> Femenino<br>
             <input type="radio" name="genero" value="otro"> Otro

             <br><br>

             <label>
             <input type="checkbox" name="terminos" required>
              Acepto los términos y condiciones
             </label>
             <br><br>
             <input type="submit" value="Registrarse">             
          </fieldset>
        </form>
    </td>
  </tr>
</table>








</body>
</html>
