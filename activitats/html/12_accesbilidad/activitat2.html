<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>    

<a href="#main">Saltar al contenido</a>

<header>    
    <h1 id="titulo-principal">Registro de Usuario</h1>
    <p id="subtitulo">Crea tu cuenta rellenando el siguiente formulario.</p>
</header>

<main id="main">

    <form action="#" method="post">

        <fieldset>
            <legend id="legend-datos">Datos personales</legend>

            <p>
                <label for="nombre">Nombre completo</label><br>
                <input 
                    type="text" 
                    id="nombre" 
                    name="nombre"
                    required
                    autocomplete="name">
            </p>
             <label>
                 Edad
             <input type="number" name="mi-edad" min="0" max="120">
            </label>
            <p>
                <label for="email">Correo electrónico</label><br>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    required
                    autocomplete="email">
            </p>
            <p>
                <label for="password">Contraseña</label><br>
                <input 
                type="password" 
                id="password" 
                name="password"
                required
                minlength="6"
                aria-describedby="ayuda-password"
                autocomplete="new-password">
            </p>

            <p>
            <label for="confirm-password">Confirmar contraseña</label><br>
            <input 
                type="password" 
                id="confirm-password" 
                name="confirm-password"
                required
                minlength="6"
                autocomplete="new-password">
            </p>
            <p id="ayuda-password">
                La contraseña debe tener al menos 6 caracteres.
            </p>

        </fieldset>
        <fieldset>
        <legend id="legend-preferencias">Preferencias</legend>

            <p>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">
                    Deseo recibir el boletín informativo
                </label>
            </p>

            <p>
                <input type="checkbox" id="condiciones" name="condiciones" required>
                <label for="condiciones">
                    Acepto las condiciones de uso
                </label>
            </p>       
        </fieldset>

        <p>
            <button type="submit" id="btn-registrar">Registrarse</button>
        </p>
        </form>
        </main>
        <footer>
        <p>&copy; 2026 Web accesible</p>
        <nav aria-label="Enlaces de pie de página">
            <ul>
                 <li><a href="privacidad.html">Política de Privacidad</a></li>
                 <li><a href="termino.html">Términos de Servicio</a></li>
            </ul>
        </nav>
</footer>

</body>
</html>
