<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>    

<a href="#main">Saltar al contenido</a>

<header>
    <h1>Registro de Usuario</h1>
    <p>Crea tu cuenta rellenando el siguiente formulario.</p>
</header>

<main id="main">

    <form action="#" method="post">

        <fieldset>
            <legend>Datos personales</legend>

            <p>
                <label for="nombre">Nombre completo</label><br>
                <input 
                    type="text" 
                    id="nombre" 
                    name="nombre"
                    required
                    autocomplete="name">
            </p>
             <label>
                 Edad
             <input type="number" name="mi-edad" min="0" max="120">
            </label>
            <p>
                <label for="email">Correo electrónico</label><br>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    required
                    autocomplete="email">
            </p>

            <p>
                <label for="password">Contraseña</label><br>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    required
                    minlength="6"
                    aria-describedby="ayuda-password"
                    autocomplete="new-password">
            </p>

            <p>
                <label for="password">Confirmar contraseña</label><br>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    required
                    minlength="6"
                    aria-describedby="ayuda-password"
                    autocomplete="new-password">
            </p>

            <p id="ayuda-password">
                La contraseña debe tener al menos 6 caracteres.
            </p>

        </fieldset>
        <fieldset>
            <legend>Preferencias</legend>

            <p>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">
                    Deseo recibir el boletín informativo
                </label>
            </p>

            <p>
                <input type="checkbox" id="condiciones" name="condiciones" required>
                <label for="condiciones">
                    Acepto las condiciones de uso
                </label>
            </p>

                <div class="form-group radio-group">
                    <p id="idioma-preferido-label">Idioma preferido:</p>
                    <div role="radiogroup" aria-labelledby="idioma-preferido-label">
                        <input type="radio" id="espanol" name="idioma" value="es" checked>
                        <label for="espanol">Español</label>

                        <input type="radio" id="ingles" name="idioma" value="en">
                        <label for="ingles">Inglés</label>

                        <input type="radio" id="frances" name="idioma" value="fr">
                        <label for="frances">Francés</label>
                    </div>
                </div>

        </fieldset>

        <p>
            <button type="submit">Registrarse</button>
        </p>

    </form>

</main>

<footer>
    <p>&copy; 2026 Web accesible</p>
     <nav aria-label="Enlaces de pie de página">
            <ul>
                <li><a href="#">Política de Privacidad</a></li>
                <li><a href="#">Términos de Servicio</a></li>
            </ul>
        </nav>
</footer>

</body>
</html>
